name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build the native renderer
        # The tests load it and run its self-test on WARP, which compiles
        # every shader and draws real frames with no GPU or display.
        run: ./native/build.ps1
        shell: pwsh

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check winduo2 tests

      - name: Test
        # The suite needs no sensor and no lid, which is the whole
        # reason the estimator takes readings as arguments.
        run: pytest

  imports:
    # Catches the mistakes a headless test run cannot: a Qt or OpenGL module
    # that fails to import at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Import every module
        run: |
          python -c "import importlib, pkgutil, winduo2; [importlib.import_module(m.name) for m in pkgutil.walk_packages(winduo2.__path__, 'winduo2.')]"
      - name: Starts
        run: python -m winduo2 --help
