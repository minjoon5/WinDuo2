name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build the native app and core
        # The tests check the C++ core against the Python step by step.
        run: ./native/build.ps1
        shell: pwsh

      - name: The native app starts and draws
        run: |
          $p = Start-Process native/build/app/plain/WinDuo2.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "the self-test failed ($($p.ExitCode))" }
        shell: pwsh

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check winduo2 tests

      - name: Test
        # The suite needs no sensor and no lid, which is the whole
        # reason the estimator takes readings as arguments.
        run: pytest

  imports:
    # Catches a module that fails to import at all, with only the declared
    # dependencies installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Import every module
        run: |
          python -c "import importlib, pkgutil, winduo2; [importlib.import_module(m.name) for m in pkgutil.walk_packages(winduo2.__path__, 'winduo2.')]"
