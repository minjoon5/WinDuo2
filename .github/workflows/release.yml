name: Build the Windows app

on:
  push:
    tags: ["v*", "Build_*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Two builds of the same native code:
    #
    # - portable: the single WinDuo2.exe, run from anywhere. Start, search and
    #   quick settings are closed when the effect starts.
    # - installer: the same exe with a manifest that asks for uiAccess, installed
    #   under Program Files by WinDuo2-Setup.exe. uiAccess puts the overlay
    #   above those flyouts so they are blurred instead. Windows only grants it
    #   to a signed exe, so it is signed here when the WINDOWS_CERT_PFX
    #   (base64 .pfx) and WINDOWS_CERT_PASSWORD secrets are set, for example
    #   from packaging/windows/make-signing-cert.ps1; a PC that trusts that
    #   certificate once runs every later release. Without them it is left
    #   for packaging/windows/trust-self-signed.ps1 to sign on the user's own
    #   machine, which the installer does by default. Both are one exe with
    #   nothing unpacked anywhere at run time, which a location only
    #   administrators can write to depends on.
    strategy:
      matrix:
        include:
          - variant: portable
          - variant: installer
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        # All native: the effect, the sensors, the tray and the settings, in
        # one exe with no Python, Qt or other runtime beside it.
        run: ./native/build.ps1
        shell: pwsh

      - name: Check it starts and draws
        # --selftest compiles every shader and draws real frames on WARP, and
        # runs the effect's logic through a close. The uiAccess exe cannot run
        # here (Windows refuses one outside Program Files); it is the same code.
        run: |
          $p = Start-Process native/build/app/plain/WinDuo2.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "the self-test failed ($($p.ExitCode))" }
        shell: pwsh

      - name: Stage
        run: |
          New-Item -ItemType Directory -Force dist/WinDuo2 | Out-Null
          if ("${{ matrix.variant }}" -eq "portable") {
            Copy-Item native/build/app/plain/WinDuo2.exe dist/WinDuo2.exe
          } else {
            Copy-Item native/build/app/uiaccess/WinDuo2.exe dist/WinDuo2/WinDuo2.exe
          }
        shell: pwsh

      - name: Check the manifest asks for uiAccess
        if: matrix.variant == 'installer'
        # This exe cannot be run here: Windows refuses a uiAccess exe outside
        # Program Files. The portable build checks the same bundle imports.
        run: |
          $bytes = [IO.File]::ReadAllBytes("dist/WinDuo2/WinDuo2.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'uiAccess="true"') { throw "uiAccess is missing from the manifest" }
          Write-Host "manifest asks for uiAccess"
        shell: pwsh

      - name: Prepare signing
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          # A self-signed certificate from make-signing-cert.ps1 is its own
          # root. Trusting it on this throwaway runner lets signtool build the
          # chain and the verify step below check the signature.
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CERT_PASSWORD)
          if ($cert.Subject -eq $cert.Issuer) {
            $store = [Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
            $store.Open("ReadWrite")
            $store.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData))
            $store.Close()
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Sign the exe
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          & $env:SIGNTOOL sign /fd SHA256 /f $env:SIGNING_PFX /p $env:WINDOWS_CERT_PASSWORD
          /tr http://timestamp.digicert.com /td SHA256 dist/WinDuo2/WinDuo2.exe;
          & $env:SIGNTOOL verify /pa dist/WinDuo2/WinDuo2.exe;
          if ($LASTEXITCODE -ne 0) { throw "the signature does not verify" }
        shell: pwsh

      - name: Build the installer
        if: matrix.variant == 'installer'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/WinDuo2.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
        shell: pwsh

      - name: Sign the installer
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          & $env:SIGNTOOL sign /fd SHA256 /f $env:SIGNING_PFX /p $env:WINDOWS_CERT_PASSWORD
          /tr http://timestamp.digicert.com /td SHA256 dist/WinDuo2-Setup.exe
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: WinDuo2-${{ matrix.variant }}
          path: ${{ matrix.variant == 'portable' && 'dist/WinDuo2.exe' || 'dist/WinDuo2-Setup.exe' }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinDuo2.exe
            dist/WinDuo2-Setup.exe
          generate_release_notes: true
          body: |
            Two ways to run it, both for Windows 10 version 2004 or later on a
            laptop with a hinge angle sensor, such as a convertible. No
            calibration: WinDuo2 sits in the notification area and the effect
            follows the lid.

            - **`WinDuo2.exe`**: one file, nothing to install. Start, search
              and quick settings close when the effect starts.
            - **`WinDuo2-Setup.exe`**: installs under Program Files with
              uiAccess, so Start, search and quick settings stay open and are
              blurred too. Windows only allows that for an exe signed by a
              certificate the PC trusts, so leave *Sign WinDuo2 with a
              certificate made on this PC* ticked while installing; see
              docs/uiaccess.md.

            Windows SmartScreen may warn about an unrecognised app. Choose
            **More info**, then **Run anyway**.
