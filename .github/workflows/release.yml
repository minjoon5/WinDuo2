name: Build the Windows app

on:
  push:
    tags: ["v*", "Build_*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Two builds from the same bundle:
    #
    # - portable: the single WinDuo2.exe, run from anywhere. Start, search and
    #   quick settings are closed when the effect starts.
    # - installer: a folder build whose manifest asks for uiAccess, installed
    #   under Program Files by WinDuo2-Setup.exe. uiAccess puts the overlay
    #   above those flyouts so they are blurred instead. Windows only grants it
    #   to a signed exe, so it is signed here when the WINDOWS_CERT_PFX
    #   (base64 .pfx) and WINDOWS_CERT_PASSWORD secrets are set, for example
    #   from packaging/windows/make-signing-cert.ps1; a PC that trusts that
    #   certificate once runs every later release. Without them it is left
    #   for packaging/windows/trust-self-signed.ps1 to sign on the user's own
    #   machine after each install. It is a folder, not --onefile, because a one-file
    #   build unpacks its code into %TEMP%, which defeats the point of
    #   requiring a location only administrators can write to.
    strategy:
      matrix:
        include:
          - variant: portable
            layout: --onefile
          - variant: installer
            layout: --onedir --uac-uiaccess
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          pip install pyinstaller==6.11.1

      - name: Remove OpenCV's unused video-file decoder before packaging
        # opencv_videoio_ffmpeg is ~29 MB and is only consulted by
        # cv2.VideoCapture when opening a video *file*; this app only uses
        # OpenCV to resize captured screen frames, so the plugin is dead
        # weight. It has to be deleted from cv2's own install directory before
        # PyInstaller runs: for a --onefile build everything is packed into
        # the exe during the build itself, so nothing is left in dist/
        # afterward to strip, and --exclude-module only applies to importable
        # Python modules, not raw DLLs that a hook collects as data.
        run: |
          $cv2Path = python -c "import cv2, os; print(os.path.dirname(cv2.__file__))"
          Get-ChildItem -Path $cv2Path -Filter "*ffmpeg*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Removing $($_.FullName) ($([math]::Round($_.Length / 1MB, 1)) MB)"
            Remove-Item $_.FullName -Force
          }
        shell: pwsh

      - name: Build
        # No console window; one file or one folder, per the matrix above.
        #
        # --collect-all PyQt6 used to pull in the whole Qt distribution: Quick,
        # Qml, Quick3D, Designer, Pdf, WebEngine, Bluetooth, Sql, every
        # QuickControls2 style, and translations for every locale, none of
        # which this app imports. The app only uses QtCore, QtGui, QtWidgets,
        # and QtOpenGLWidgets, so --collect-submodules targets exactly those,
        # and the --exclude-module list removes the plugin categories
        # PyInstaller otherwise collects alongside them because they share a
        # QtCore dependency. This took the build from roughly 150 MB to well
        # under half that.
        #
        # cv2 and OpenGL still need --collect-all: both load compiled
        # extensions and, for OpenGL, GL functions via ctypes at runtime, which
        # PyInstaller's static import scan cannot see coming. OpenCV's own
        # FFmpeg video-file plugin is excluded because the app never opens a
        # video file, so that decoder is dead weight.
        #
        # winrt is collected whole: the sensor projections are imported on the
        # sensor thread, inside functions, where the static scan does not look.
        #
        # numpy needs the same --collect-all: cv2 imports it at C level, and
        # PyInstaller's static scan misses numpy's compiled extension
        # submodules (numpy.core._multiarray_umath and friends) often enough
        # that "Importing the numpy C-extensions failed" is the single most
        # common PyInstaller failure with numpy. --copy-metadata numpy is
        # needed too, because numpy reads its own dist-info at import time to
        # resolve its version, and a --onefile build has none unless it is
        # copied in explicitly.
        run: >
          pyinstaller
          ${{ matrix.layout }}
          --noconsole
          --name WinDuo2
          --icon winduo2/ui/icon.ico
          --add-data winduo2/ui/icon.png:winduo2/ui
          --add-data winduo2/ui/check.png:winduo2/ui
          --add-data winduo2/ui/check@2x.png:winduo2/ui
          --collect-submodules PyQt6.QtCore
          --collect-submodules PyQt6.QtGui
          --collect-submodules PyQt6.QtWidgets
          --collect-submodules PyQt6.QtOpenGLWidgets
          --collect-all cv2
          --collect-all OpenGL
          --collect-all dxcam
          --collect-all numpy
          --collect-all winrt
          --copy-metadata numpy
          --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick
          --exclude-module PyQt6.QtQuick3D
          --exclude-module PyQt6.QtQuickWidgets
          --exclude-module PyQt6.QtQuickControls2
          --exclude-module PyQt6.QtDesigner
          --exclude-module PyQt6.QtPdf
          --exclude-module PyQt6.QtPdfWidgets
          --exclude-module PyQt6.QtWebEngineCore
          --exclude-module PyQt6.QtWebEngineWidgets
          --exclude-module PyQt6.QtWebSockets
          --exclude-module PyQt6.QtMultimedia
          --exclude-module PyQt6.QtMultimediaWidgets
          --exclude-module PyQt6.QtBluetooth
          --exclude-module PyQt6.QtNfc
          --exclude-module PyQt6.QtSql
          --exclude-module PyQt6.QtTest
          --exclude-module PyQt6.QtSensors
          --exclude-module PyQt6.QtSerialPort
          --exclude-module PyQt6.QtPositioning
          --exclude-module PyQt6.QtHelp
          --exclude-module PyQt6.QtDBus
          --exclude-module PyQt6.QtDesigner
          --exclude-module PyQt6.QtNetwork
          --exclude-module PyQt6.QtSvgWidgets
          --exclude-module PyQt6.QtRemoteObjects
          --exclude-module PyQt6.QtXml
          --exclude-module PyQt6.QtXmlPatterns
          --exclude-module tkinter
          --exclude-module matplotlib
          winduo2/__main__.py

      - name: Check it starts
        if: matrix.variant == 'portable'
        # --version exits before any window, sensor, or GPU work, so it is a real
        # check that the bundle imports cleanly on a machine with no dev setup.
        run: ./dist/WinDuo2.exe --version

      - name: Check the manifest asks for uiAccess
        if: matrix.variant == 'installer'
        # This exe cannot be run here: Windows refuses a uiAccess exe outside
        # Program Files. The portable build checks the same bundle imports.
        run: |
          $bytes = [IO.File]::ReadAllBytes("dist/WinDuo2/WinDuo2.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'uiAccess="true"') { throw "uiAccess is missing from the manifest" }
          Write-Host "manifest asks for uiAccess"
        shell: pwsh

      - name: Prepare signing
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          # A self-signed certificate from make-signing-cert.ps1 is its own
          # root. Trusting it on this throwaway runner lets signtool build the
          # chain and the verify step below check the signature.
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CERT_PASSWORD)
          if ($cert.Subject -eq $cert.Issuer) {
            $store = [Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
            $store.Open("ReadWrite")
            $store.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData))
            $store.Close()
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Sign the exe
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          & $env:SIGNTOOL sign /fd SHA256 /f $env:SIGNING_PFX /p $env:WINDOWS_CERT_PASSWORD
          /tr http://timestamp.digicert.com /td SHA256 dist/WinDuo2/WinDuo2.exe;
          & $env:SIGNTOOL verify /pa dist/WinDuo2/WinDuo2.exe;
          if ($LASTEXITCODE -ne 0) { throw "the signature does not verify" }
        shell: pwsh

      - name: Build the installer
        if: matrix.variant == 'installer'
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import winduo2; print(winduo2.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/WinDuo2.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
        shell: pwsh

      - name: Sign the installer
        if: matrix.variant == 'installer' && env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          & $env:SIGNTOOL sign /fd SHA256 /f $env:SIGNING_PFX /p $env:WINDOWS_CERT_PASSWORD
          /tr http://timestamp.digicert.com /td SHA256 dist/WinDuo2-Setup.exe
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: WinDuo2-${{ matrix.variant }}
          path: ${{ matrix.variant == 'portable' && 'dist/WinDuo2.exe' || 'dist/WinDuo2-Setup.exe' }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinDuo2.exe
            dist/WinDuo2-Setup.exe
          generate_release_notes: true
          body: |
            Two ways to run it, both for Windows 10 version 2004 or later on a
            laptop with a hinge angle sensor, such as a convertible. No
            calibration: WinDuo2 sits in the notification area and the effect
            follows the lid.

            - **`WinDuo2.exe`**: one file, nothing to install. Start, search
              and quick settings close when the effect starts.
            - **`WinDuo2-Setup.exe`**: installs under Program Files with
              uiAccess, so Start, search and quick settings stay open and are
              blurred too. Windows only allows that for an exe signed by a
              certificate the PC trusts; see the README for trusting the
              signing certificate once, or for signing an unsigned build.

            Windows SmartScreen may warn about an unrecognised app. Choose
            **More info**, then **Run anyway**.
