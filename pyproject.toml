[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winduo2"
version = "1.0.0"
description = "The reference implementation WinDuo2's native effect core is checked against"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
keywords = ["windows", "laptop", "lid-angle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/minjoon5/WinDuo2"
Source = "https://github.com/minjoon5/WinDuo2"
Issues = "https://github.com/minjoon5/WinDuo2/issues"

[tool.setuptools.packages.find]
include = ["winduo2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]
ignore = [
    # Assigning to a loop variable reads fine in the step loops.
    "B007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
