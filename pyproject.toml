[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winduo2"
version = "1.0.0"
description = "Lean the screen away as the laptop lid closes, read from the lid sensor"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["windows", "overlay", "opengl", "laptop", "lid-angle", "accelerometer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "PyQt6>=6.6,<7",
    "PyOpenGL>=3.1.7",
    "opencv-python>=4.8",
    "numpy>=1.26,<3",
    "dxcam>=0.3; sys_platform == 'win32'",
    "mss>=9.0",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Sensors>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/minjoon5/duo"
Source = "https://github.com/minjoon5/duo"
Issues = "https://github.com/minjoon5/duo/issues"

[project.gui-scripts]
winduo2 = "winduo2.main:main"

[tool.setuptools.packages.find]
include = ["winduo2*"]

[tool.setuptools.package-data]
winduo2 = ["ui/icon.png", "ui/icon.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Qt call chains and OpenGL constant names are long by nature. 92 forced awkward
# wrapping in the widget code for no gain in readability.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]
ignore = [
    # Qt method names are fixed by the framework.
    "N802",
    # Assigning to a loop variable reads fine in the render loops.
    "B007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"winduo2/render/shaders.py" = ["E501"]
# The ctypes structures deliberately carry the names the Windows API gives them,
# so a reader can look them up.
"winduo2/angle/lidswitch.py" = ["N801"]
